<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โรงงานวัตถุ: เกมทบทวนแนวคิดเชิงวัตถุและ UML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;600&family=Prompt:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#EAF1F8; --grid:#D3E0EE; --ink:#14304E; --ink-2:#4D6680; --blue:#2A74B4;
  --amber:#B87A08; --good:#237A4B; --bad:#B63A30; --card:#F8FBFE; --line:#9DB4CC;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#10233F; --grid:#1A3254; --ink:#EAF2FA; --ink-2:#A3B8CF; --blue:#4FA3E0;
    --amber:#F2B33D; --good:#5CC48A; --bad:#F07A6E; --card:#152D4D; --line:#3A5A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:#10233F; --grid:#1A3254; --ink:#EAF2FA; --ink-2:#A3B8CF; --blue:#4FA3E0;
  --amber:#F2B33D; --good:#5CC48A; --bad:#F07A6E; --card:#152D4D; --line:#3A5A80;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--ink);
  font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  font-size: 17px; line-height: 1.65;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 56px; }
h1, h2, h3, .disp { font-family: "Prompt", "IBM Plex Sans Thai", system-ui, sans-serif; }
.mono { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

/* Title block: the drawing's corner stamp, used as the scoreboard */
.tblock { display: grid; grid-template-columns: 1.7fr repeat(4, 1fr); border: 2px solid var(--ink); background: var(--card); }
.tblock > div { padding: 6px 12px; border-left: 1px solid var(--line); min-width: 0; }
.tblock > div:first-child { border-left: 0; display: flex; align-items: center; gap: 10px; }
.tblock small { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.tblock b { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.brand { font-family: "Prompt", system-ui, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; }
.brand-mark { width: 30px; height: 30px; flex: none; color: var(--blue); }
.homebtn { margin-left: auto; background: none; border: 1px solid var(--line); padding: 2px 10px; font-size: 14px; cursor: pointer; }
@media (max-width: 720px) {
  .tblock { grid-template-columns: repeat(2, 1fr); }
  .tblock > div:first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--line); }
  .tblock > div:nth-child(2), .tblock > div:nth-child(4) { border-left: 0; }
  .tblock > div:nth-child(n+2):nth-child(-n+3) { border-bottom: 1px solid var(--line); }
}

/* Home */
.hero h1 { font-size: clamp(46px, 9vw, 96px); line-height: 1.02; margin: 34px 0 10px; font-weight: 700; letter-spacing: -0.01em; }
.hero p { max-width: 58ch; color: var(--ink-2); margin: 0 0 6px; }
.line { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; margin: 34px 0 26px; }
.line::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 3px dashed var(--line); z-index: 0; }
.st { position: relative; z-index: 1; text-align: left; background: var(--card); border: 2px solid var(--ink); padding: 16px 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.st:hover { border-color: var(--blue); }
.st .n { font-size: 13px; color: var(--ink-2); }
.st h3 { margin: 0; font-size: 21px; line-height: 1.3; }
.st p { margin: 0; font-size: 15px; color: var(--ink-2); line-height: 1.5; }
.stars { color: var(--amber); letter-spacing: 2px; font-size: 18px; margin-top: 6px; }
.stars .off { color: var(--line); }
@media (max-width: 820px) {
  .line { grid-template-columns: 1fr; gap: 14px; }
  .line::before { left: 22px; right: auto; top: 0; bottom: 0; border-top: 0; border-left: 3px dashed var(--line); }
}
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--paper); padding: 12px 22px; font-family: "Prompt", system-ui, sans-serif; font-size: 18px; font-weight: 500; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.note { font-size: 15px; color: var(--ink-2); }

/* Game */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; margin-top: 20px; align-items: start; }
.stage.solo { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.q { background: var(--card); border: 2px solid var(--ink); padding: 22px 24px 24px; }
.q .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--ink-2); }
.q .ctx { margin: 12px 0 0; font-size: 15px; color: var(--ink-2); }
.q h2 { margin: 6px 0 0; font-size: clamp(22px, 3.2vw, 28px); line-height: 1.4; font-weight: 500; }
.piece { margin: 18px 0 4px; padding: 18px 20px; border: 2px dashed var(--blue); font-size: clamp(22px, 3.6vw, 30px); line-height: 1.35; font-weight: 600; overflow-wrap: anywhere; }
.fig { margin: 18px 0 4px; display: flex; justify-content: center; padding: 12px; border: 1px solid var(--line); }
.fig svg { width: 100%; max-width: 300px; height: auto; color: var(--ink); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 2px solid var(--ink); background: transparent; padding: 12px 14px; min-height: 58px; font-weight: 600; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 8%, transparent); }
.opt .k { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; color: var(--ink-2); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, transparent); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.opt.dim { opacity: .5; }
.fb { margin-top: 18px; padding: 12px 16px; border-left: 6px solid var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.fb.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, transparent); }
.fb strong { font-family: "Prompt", system-ui, sans-serif; font-weight: 500; font-size: 18px; display: block; }
.fb p { margin: 2px 0 0; }
.next { margin-top: 18px; justify-content: flex-end; }
.gain { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--amber); font-weight: 600; }

/* Side panels */
.side { display: flex; flex-direction: column; gap: 14px; }
.side h3 { margin: 0; font-size: 17px; font-weight: 500; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bin { border: 2px solid var(--ink); background: var(--card); padding: 8px 10px; min-height: 92px; }
.bin .t { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; }
.bin ul { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.bin li { overflow-wrap: anywhere; }
.bin.hit { border-color: var(--blue); }
.cbox { border: 2px solid var(--ink); background: var(--card); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; }
.cbox .nm { padding: 10px; text-align: center; font-weight: 600; border-bottom: 2px solid var(--ink); min-height: 46px; font-size: 17px; }
.cbox ul { list-style: none; margin: 0; padding: 10px 12px; min-height: 86px; }
.cbox ul + ul { border-top: 2px solid var(--ink); }
.cbox li { line-height: 1.6; overflow-wrap: anywhere; }
.cbox .ph { color: var(--line); font-family: "IBM Plex Sans Thai", system-ui, sans-serif; font-size: 14px; }
.tray { border: 2px dashed var(--line); padding: 8px 12px; font-size: 14px; color: var(--ink-2); min-height: 48px; }
.tray s { color: var(--ink-2); }
.drop { animation: drop .35s ease-out; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .drop { animation: none; } }

/* Summary */
.sum { background: var(--card); border: 2px solid var(--ink); padding: 26px 26px 28px; margin-top: 20px; max-width: 760px; }
.sum h2 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.2; }
.big-stars { font-size: 44px; color: var(--amber); letter-spacing: 6px; margin: 10px 0 4px; }
.big-stars .off { color: var(--line); }
table.rep { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 16px; }
table.rep th, table.rep td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
table.rep th { font-weight: 600; background: color-mix(in srgb, var(--blue) 10%, transparent); }
.rank { font-family: "Prompt", system-ui, sans-serif; font-size: clamp(28px, 5vw, 40px); color: var(--blue); margin: 6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="tblock" aria-label="ป้ายข้อมูลการเล่น">
    <div>
      <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="24" height="24"/><path d="M3 11h24M3 19h24"/></g></svg>
      <span class="brand">โรงงานวัตถุ</span>
      <button class="homebtn" id="homeBtn" hidden>หน้าแรก</button>
    </div>
    <div><small>สถานี</small><b id="hStation">–</b></div>
    <div><small>ชิ้นงาน</small><b id="hItem">–</b></div>
    <div><small>คะแนน</small><b id="hScore">0</b></div>
    <div><small>ต่อเนื่อง</small><b id="hCombo">–</b></div>
  </header>
  <main id="app"></main>
</div>

<script>
const BINS = [
  { k: 'class', l: 'Class' }, { k: 'object', l: 'Object' },
  { k: 'attr', l: 'Attribute' }, { k: 'method', l: 'Method' }
];
const PILLARS = [
  { k: 'enc', l: 'Encapsulation' }, { k: 'inh', l: 'Inheritance' },
  { k: 'poly', l: 'Polymorphism' }, { k: 'abs', l: 'Abstraction' }
];
const PARTS = [
  { k: 'name', l: 'ชื่อคลาส' }, { k: 'attr', l: 'Attribute' },
  { k: 'method', l: 'Method' }, { k: 'none', l: 'ไม่ใช่ส่วนของคลาสนี้' }
];

const SORT_ITEMS = [
  { t: 'Student', a: 'class', ex: 'Student คือแม่พิมพ์ของนักศึกษาทุกคน ยังไม่ได้ระบุว่าเป็นใคร' },
  { t: 'นักศึกษาชื่อมานี รหัส 6801', a: 'object', ex: 'เป็นนักศึกษาตัวจริงหนึ่งคนที่สร้างจากคลาส Student จึงเป็น Object' },
  { t: 'studentId : String', a: 'attr', ex: 'เป็นข้อมูลที่คลาสเก็บไว้ บอกชื่อและชนิดข้อมูล จึงเป็น Attribute' },
  { t: 'register()', a: 'method', ex: 'มีวงเล็บและเป็นการกระทำ จึงเป็น Method (พฤติกรรมของคลาส)' },
  { t: 'Car', a: 'class', ex: 'Car เป็นแม่แบบของรถทุกคัน ยังไม่เจาะจงคันใด' },
  { t: 'รถสีแดง ทะเบียน กข 1234', a: 'object', ex: 'เจาะจงรถคันเดียวพร้อมค่าข้อมูลจริง จึงเป็น Object' },
  { t: 'color : String', a: 'attr', ex: 'สีเป็นข้อมูลที่รถทุกคันต้องมี จึงเป็น Attribute ของคลาส Car' },
  { t: 'startEngine()', a: 'method', ex: 'การติดเครื่องเป็นสิ่งที่รถทำได้ จึงเป็น Method' },
  { t: 'price : double', a: 'attr', ex: 'ราคาเป็นข้อมูลของสินค้า เขียนแบบ ชื่อ : ชนิดข้อมูล จึงเป็น Attribute' },
  { t: 'บัญชีเลขที่ 001-2 ของสมชาย', a: 'object', ex: 'เป็นบัญชีจริงหนึ่งบัญชีที่มีเจ้าของ จึงเป็น Object ของคลาส BankAccount' },
  { t: 'calculateTotal()', a: 'method', ex: 'การคำนวณยอดรวมเป็นพฤติกรรมของคลาส Order จึงเป็น Method' },
  { t: 'Course', a: 'class', ex: 'Course เป็นแม่แบบของรายวิชาทุกวิชา จึงเป็น Class' }
];

const PILLAR_QS = [
  { t: 'balance เป็น private และเปลี่ยนค่าได้ผ่าน deposit() กับ withdraw() เท่านั้น', a: 'enc', ex: 'ซ่อนข้อมูลไว้ในคลาส แล้วให้เข้าถึงผ่านเมธอดที่ตรวจสอบเงื่อนไขได้ คือ Encapsulation' },
  { t: 'Dog และ Cat ได้ name กับ age มาจากคลาส Animal โดยไม่ต้องเขียนซ้ำ', a: 'inh', ex: 'คลาสลูกได้รับคุณสมบัติจากคลาสแม่ คือ Inheritance' },
  { t: 'โค้ด shape.area() ให้ผลต่างกัน เมื่อ shape เป็น Circle หรือ Rectangle', a: 'poly', ex: 'เมธอดชื่อเดียว ทำงานต่างกันตามชนิดของ Object จริง คือ Polymorphism' },
  { t: 'คนขับรถใช้พวงมาลัยและคันเร่งได้ โดยไม่ต้องรู้ว่าเครื่องยนต์ทำงานอย่างไร', a: 'abs', ex: 'แสดงเฉพาะสิ่งที่จำเป็นต่อการใช้งาน ซ่อนความซับซ้อนไว้ คือ Abstraction' },
  { t: 'Manager ทำได้ทุกอย่างที่ Employee ทำ และมี approveLeave() เพิ่มเข้ามา', a: 'inh', ex: 'Manager ต่อยอดจาก Employee โดยสืบทอดของเดิมแล้วเพิ่มของใหม่ คือ Inheritance' },
  { t: 'ปุ่ม “ชำระเงิน” เรียก pay() เหมือนเดิม แต่บัตรเครดิตกับ QR ทำงานคนละแบบ', a: 'poly', ex: 'ผู้เรียกใช้ pay() แบบเดียว แต่ได้พฤติกรรมตามชนิดการชำระเงิน คือ Polymorphism' },
  { t: 'คลาส User เก็บ password เป็น private และมีแค่ checkPassword() ให้ภายนอกใช้', a: 'enc', ex: 'ภายนอกอ่านรหัสผ่านตรงๆ ไม่ได้ ต้องผ่านเมธอดที่กำหนด คือ Encapsulation' },
  { t: 'คลาส «abstract» Shape กำหนดว่าต้องมี area() แต่ไม่บอกวิธีคำนวณ', a: 'abs', ex: 'กำหนดแค่สิ่งที่ต้องมี แล้วให้คลาสลูกเติมรายละเอียด คือ Abstraction' }
];

const CLASS_SETS = [
  {
    name: 'BankAccount',
    brief: 'ออกแบบคลาสบัญชีเงินฝากสำหรับระบบธนาคาร',
    items: [
      { t: 'BankAccount', a: 'name', ex: 'ชื่อคลาสเป็นคำนามเอกพจน์ ขึ้นต้นด้วยตัวพิมพ์ใหญ่' },
      { t: '- accountNo : String', a: 'attr', ex: 'เลขบัญชีเป็นข้อมูลของบัญชี และควรเป็น private (-)' },
      { t: '- balance : double', a: 'attr', ex: 'ยอดเงินเป็นข้อมูลสำคัญ จึงซ่อนไว้เป็น private' },
      { t: '+ deposit(amount) : void', a: 'method', ex: 'การฝากเงินเป็นพฤติกรรมที่ภายนอกเรียกใช้ได้ จึงเป็น public (+)' },
      { t: '+ withdraw(amount) : bool', a: 'method', ex: 'การถอนเงินเป็นพฤติกรรม และคืนค่าว่าถอนสำเร็จหรือไม่' },
      { t: '+ getBalance() : double', a: 'method', ex: 'ให้ภายนอกอ่านยอดเงินผ่านเมธอด แทนการเปิด balance ตรงๆ' },
      { t: 'สมชาย ใจดี', a: 'none', ex: 'เป็นค่าข้อมูลของบัญชีหนึ่ง (Object) ไม่ใช่ส่วนของแม่แบบคลาส' },
      { t: '500 บาท', a: 'none', ex: 'เป็นค่าตัวเลขที่เกิดตอนใช้งาน ไม่ใช่ Attribute หรือ Method' }
    ]
  },
  {
    name: 'Product',
    brief: 'ออกแบบคลาสสินค้าสำหรับร้านค้าออนไลน์',
    items: [
      { t: 'Product', a: 'name', ex: 'Product คือชื่อคลาสของสินค้าทุกชิ้น' },
      { t: '- productId : String', a: 'attr', ex: 'รหัสสินค้าเป็นข้อมูลประจำสินค้า' },
      { t: '- price : double', a: 'attr', ex: 'ราคาเป็นข้อมูลของสินค้า' },
      { t: '- stock : int', a: 'attr', ex: 'จำนวนคงเหลือเป็นข้อมูล ชนิดจำนวนเต็ม' },
      { t: '+ updateStock(qty) : void', a: 'method', ex: 'การปรับจำนวนคงเหลือเป็นพฤติกรรมของสินค้า' },
      { t: '+ getPrice() : double', a: 'method', ex: 'อ่านราคาผ่านเมธอด ตามหลัก Encapsulation' },
      { t: 'เสื้อยืดสีขาว ไซซ์ M', a: 'none', ex: 'เป็นสินค้าชิ้นจริงหนึ่งชิ้น คือ Object ไม่ใช่ส่วนของคลาส' },
      { t: 'Customer', a: 'none', ex: 'Customer เป็นอีกคลาสหนึ่ง ไม่ใช่ส่วนประกอบของคลาส Product' }
    ]
  }
];

const box = (x, y, w, h, label) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="3"/><text x="${x + w / 2}" y="${y + h / 2 + 6}" text-anchor="middle" font-size="16" fill="currentColor" font-family="IBM Plex Mono, monospace">${label}</text>`;
const FIG = {
  actor: `<svg viewBox="0 0 120 130" role="img" aria-label="รูปคนเส้นตรง"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="60" cy="24" r="13"/><path d="M60 37v40M36 54h48M60 77l-20 34M60 77l20 34"/></g></svg>`,
  usecase: `<svg viewBox="0 0 220 100" role="img" aria-label="วงรีมีข้อความ"><ellipse cx="110" cy="50" rx="100" ry="38" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="57" text-anchor="middle" font-size="20" fill="currentColor" font-family="IBM Plex Sans Thai, sans-serif">ชำระเงิน</text></svg>`,
  klass: `<svg viewBox="0 0 220 150" role="img" aria-label="กล่องสามช่อง"><g fill="none" stroke="currentColor" stroke-width="3"><rect x="20" y="10" width="180" height="130"/><path d="M20 46h180M20 104h180"/></g><g fill="currentColor" font-family="IBM Plex Mono, monospace" font-size="16"><text x="110" y="34" text-anchor="middle" font-weight="600">Student</text><text x="32" y="70">- id : String</text><text x="32" y="92">- name : String</text><text x="32" y="128">+ login()</text></g></svg>`,
  inherit: `<svg viewBox="0 0 220 170" role="img" aria-label="เส้นทึบหัวสามเหลี่ยมโปร่ง">${box(60, 8, 100, 40, 'Animal')}${box(60, 122, 100, 40, 'Otter')}<path d="M110 122V74" stroke="currentColor" stroke-width="3"/><polygon points="110,50 96,74 124,74" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>`,
  compo: `<svg viewBox="0 0 300 70" role="img" aria-label="เส้นทึบหัวข้าวหลามตัดทึบ">${box(4, 14, 100, 42, 'Order')}${box(196, 14, 100, 42, 'Item')}<polygon points="104,35 120,25 136,35 120,45" fill="currentColor"/><path d="M136 35H196" stroke="currentColor" stroke-width="3"/></svg>`,
  aggr: `<svg viewBox="0 0 300 70" role="img" aria-label="เส้นทึบหัวข้าวหลามตัดโปร่ง">${box(4, 14, 100, 42, 'Team')}${box(196, 14, 100, 42, 'Player')}<polygon points="104,35 120,25 136,35 120,45" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M136 35H196" stroke="currentColor" stroke-width="3"/></svg>`,
  dep: `<svg viewBox="0 0 300 70" role="img" aria-label="เส้นประหัวลูกศรธรรมดา">${box(4, 14, 100, 42, 'Report')}${box(196, 14, 100, 42, 'Data')}<path d="M106 35H192" stroke="currentColor" stroke-width="3" stroke-dasharray="9 7"/><path d="M178 25L194 35L178 45" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>`,
  vis: `<svg viewBox="0 0 260 80" role="img" aria-label="สัญลักษณ์ บวก ลบ ชาร์ป และตัวหนอน"><text x="130" y="56" text-anchor="middle" font-size="48" fill="currentColor" font-family="IBM Plex Mono, monospace" font-weight="600" letter-spacing="14">+ - # ~</text></svg>`
};
const UML_QS = [
  { t: 'สัญลักษณ์นี้ใน Use Case Diagram คืออะไร', fig: 'actor', a: 'Actor', o: ['Actor', 'Object', 'Lifeline', 'Class'], ex: 'Actor คือบทบาทภายนอกที่ใช้ระบบ เป็นได้ทั้งคน ระบบอื่น หรืออุปกรณ์' },
  { t: 'วงรีที่มีข้อความอยู่ข้างในคืออะไร', fig: 'usecase', a: 'Use Case', o: ['Use Case', 'Activity Final', 'Class', 'Swimlane'], ex: 'Use Case คือสิ่งที่ระบบทำให้ผู้ใช้ ตั้งชื่อเป็นคำกริยา + คำนาม' },
  { t: 'กล่องสามช่องนี้คือสัญลักษณ์ของอะไร', fig: 'klass', a: 'Class', o: ['Class', 'Use Case', 'Actor', 'Decision'], ex: 'Class มี 3 ช่อง: ชื่อคลาส, Attribute และ Method' },
  { t: 'เส้นทึบหัวสามเหลี่ยมโปร่งหมายถึงความสัมพันธ์ใด', fig: 'inherit', a: 'Inheritance', o: ['Inheritance', 'Association', 'Dependency', 'Composition'], ex: 'Inheritance: คลาสลูกชี้ไปหาคลาสแม่ Otter สืบทอดจาก Animal' },
  { t: 'ข้าวหลามตัดทึบที่ฝั่ง Order หมายถึงความสัมพันธ์ใด', fig: 'compo', a: 'Composition', o: ['Composition', 'Aggregation', 'Inheritance', 'Dependency'], ex: 'Composition คือเป็นส่วนหนึ่งที่ขาดไม่ได้ ลบ Order แล้ว Item หายตาม' },
  { t: 'ข้าวหลามตัดโปร่งที่ฝั่ง Team หมายถึงความสัมพันธ์ใด', fig: 'aggr', a: 'Aggregation', o: ['Aggregation', 'Composition', 'Realization', 'Association'], ex: 'Aggregation คือมีส่วนประกอบ แต่ส่วนย่อยอยู่รอดได้เอง ยุบทีมแล้วนักเตะยังอยู่' },
  { t: 'เส้นประหัวลูกศรธรรมดาหมายถึงความสัมพันธ์ใด', fig: 'dep', a: 'Dependency', o: ['Dependency', 'Association', 'Realization', 'Inheritance'], ex: 'Dependency คือใช้งานชั่วคราว เช่น รับเป็นพารามิเตอร์ในเมธอด' },
  { t: 'สัญลักษณ์ชุดนี้ที่อยู่หน้า Attribute และ Method คืออะไร', fig: 'vis', a: 'Visibility', o: ['Visibility', 'Multiplicity', 'Guard Condition', 'Stereotype'], ex: 'Visibility: + public, - private, # protected, ~ package' },
  { t: 'Class Diagram อยู่ในกลุ่มแผนภาพใดของ UML', a: 'Structural (โครงสร้าง)', o: ['Structural (โครงสร้าง)', 'Behavioral (พฤติกรรม)'], ex: 'Class Diagram แสดงโครงสร้างของระบบ จึงอยู่กลุ่ม Structural' },
  { t: 'Use Case Diagram อยู่ในกลุ่มแผนภาพใดของ UML', a: 'Behavioral (พฤติกรรม)', o: ['Structural (โครงสร้าง)', 'Behavioral (พฤติกรรม)'], ex: 'Use Case Diagram แสดงว่าผู้ใช้ทำอะไรกับระบบ จึงอยู่กลุ่ม Behavioral' }
];

const STATIONS = [
  { name: 'คัดแยกชิ้นส่วน', desc: 'แยกชิ้นงานลงถัง Class, Object, Attribute และ Method' },
  { name: 'ตรวจหลักการ', desc: 'อ่านสถานการณ์ แล้วบอกว่าเป็นหลัก OOP ข้อใด' },
  { name: 'ประกอบคลาส', desc: 'ใส่ชิ้นส่วนให้ถูกช่องของกล่องคลาส' },
  { name: 'อ่านแบบ UML', desc: 'บอกความหมายของสัญลักษณ์ UML' }
];

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const $ = s => document.querySelector(s);
const app = $('#app');
const STORE = 'oop-factory-v1';

let saved = { best: 0, stars: [0, 0, 0, 0] };
try { const raw = localStorage.getItem(STORE); if (raw) { const v = JSON.parse(raw); if (v && Array.isArray(v.stars)) saved = v; } } catch (e) {}
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} };

const G = { mode: 'home', st: 0, i: 0, score: 0, combo: 0, correct: 0, rounds: [], answered: false, res: [null, null, null, null], run: false, placed: null };

function buildRounds(n) {
  if (n === 0) return shuffle(SORT_ITEMS).map(it => ({ prompt: 'ชิ้นงานนี้ควรลงถังไหน', piece: it.t, opts: BINS, ans: it.a, ex: it.ex }));
  if (n === 1) return shuffle(PILLAR_QS).map(q => ({ prompt: q.t, opts: PILLARS, ans: q.a, ex: q.ex, big: true }));
  if (n === 2) {
    const out = [];
    CLASS_SETS.forEach((cs, ci) => shuffle(cs.items).forEach(it => out.push({ prompt: 'ชิ้นนี้อยู่ส่วนไหนของคลาส', ctx: cs.brief, piece: it.t, opts: PARTS, ans: it.a, ex: it.ex, set: ci })));
    return out;
  }
  return shuffle(UML_QS).map(q => ({ prompt: q.t, fig: q.fig, opts: shuffle(q.o).map(o => ({ k: o, l: o })), ans: q.a, ex: q.ex }));
}

function hud() {
  const inGame = G.mode === 'play';
  $('#hStation').textContent = G.mode === 'home' ? '–' : `${G.st + 1}/4 ${STATIONS[G.st].name}`;
  $('#hItem').textContent = inGame ? `${G.i + 1}/${G.rounds.length}` : '–';
  $('#hScore').textContent = G.score;
  $('#hCombo').textContent = inGame && G.combo > 1 ? `×${G.combo}` : '–';
  $('#homeBtn').hidden = G.mode === 'home';
}

const starHTML = (n, cls) => `<span class="${cls || 'stars'}" aria-label="${n} ดาว จาก 3">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`;

function home() {
  G.mode = 'home'; hud();
  app.innerHTML = `
    <section class="hero">
      <h1>โรงงานวัตถุ</h1>
      <p>เกมทบทวนสัปดาห์ที่ 1 วิชาการวิเคราะห์และออกแบบระบบเชิงวัตถุ ผ่าน 4 สถานีในสายการผลิต ตั้งแต่แยกคลาสกับวัตถุ ไปจนถึงอ่านสัญลักษณ์ UML</p>
      <p class="note">แตะคำตอบ หรือกดเลข 1–4 บนคีย์บอร์ด แล้วกด Enter เพื่อไปชิ้นถัดไป ตอบถูกต่อเนื่องได้โบนัสเพิ่ม${saved.best ? ` · คะแนนสูงสุดของคุณ ${saved.best}` : ''}</p>
    </section>
    <nav class="line" aria-label="สถานีในสายการผลิต">
      ${STATIONS.map((s, i) => `<button class="st" data-st="${i}"><span class="n">สถานี ${i + 1}</span><h3>${s.name}</h3><p>${s.desc}</p>${starHTML(saved.stars[i] || 0)}</button>`).join('')}
    </nav>
    <div class="row"><button class="btn" id="runAll">เริ่มเดินสายการผลิตทั้ง 4 สถานี</button><span class="note">หรือเลือกฝึกทีละสถานีจากด้านบน</span></div>`;
  $('#runAll').onclick = () => { G.score = 0; G.res = [null, null, null, null]; G.run = true; start(0); };
  app.querySelectorAll('.st').forEach(b => b.onclick = () => { G.score = 0; G.res = [null, null, null, null]; G.run = false; start(+b.dataset.st); });
}

function start(n) {
  G.mode = 'play'; G.st = n; G.i = 0; G.combo = 0; G.correct = 0; G.rounds = buildRounds(n);
  G.placed = n === 0 ? { class: [], object: [], attr: [], method: [] } : n === 2 ? { name: '', attr: [], method: [], none: [] } : null;
  render();
}

function sidePanel() {
  const r = G.rounds[G.i];
  if (G.st === 0) {
    return `<aside class="side" aria-label="ถังคัดแยก"><h3>ถังคัดแยก</h3><div class="bins">${BINS.map(b => `<div class="bin" data-bin="${b.k}"><div class="t"><span>${b.l}</span><span class="mono">${G.placed[b.k].length}</span></div><ul>${G.placed[b.k].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></aside>`;
  }
  if (G.st === 2) {
    const cs = CLASS_SETS[r.set];
    const p = G.placed;
    const li = arr => arr.length ? arr.map(x => `<li>${esc(x)}</li>`).join('') : '<li class="ph">ยังว่าง</li>';
    return `<aside class="side" aria-label="กล่องคลาสที่กำลังประกอบ"><h3>กล่องคลาสที่กำลังประกอบ</h3>
      <div class="cbox"><div class="nm">${p.name ? esc(p.name) : '<span class="ph">ชื่อคลาส</span>'}</div><ul>${li(p.attr)}</ul><ul>${li(p.method)}</ul></div>
      <div class="tray"><div>ไม่ใช่ส่วนของคลาส ${esc(cs.name)}</div>${p.none.map(x => `<div><s>${esc(x)}</s></div>`).join('')}</div></aside>`;
  }
  return '';
}

function render() {
  hud();
  const r = G.rounds[G.i];
  const hasSide = G.st === 0 || G.st === 2;
  app.innerHTML = `
    <div class="stage ${hasSide ? '' : 'solo'}">
      <section class="q" aria-labelledby="qText">
        <div class="meta"><span>สถานี ${G.st + 1}: ${STATIONS[G.st].name}</span><span>ชิ้นที่ ${G.i + 1} จาก ${G.rounds.length}</span></div>
        ${r.ctx ? `<p class="ctx">${esc(r.ctx)}</p>` : ''}
        <h2 id="qText">${esc(r.prompt)}</h2>
        ${r.piece ? `<div class="piece mono">${esc(r.piece)}</div>` : ''}
        ${r.fig ? `<div class="fig">${FIG[r.fig]}</div>` : ''}
        <div class="opts" role="group" aria-label="ตัวเลือก">${r.opts.map((o, i) => `<button class="opt" data-k="${esc(o.k)}"><span class="k">${i + 1}</span><span>${esc(o.l)}</span></button>`).join('')}</div>
        <div id="fb" aria-live="polite"></div>
        <div class="row next"><button class="btn" id="nextBtn" hidden>${G.i + 1 < G.rounds.length ? 'ชิ้นถัดไป' : 'ดูผลสถานีนี้'}</button></div>
      </section>
      ${sidePanel()}
    </div>`;
  G.answered = false;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.k));
  $('#nextBtn').onclick = next;
}

function answer(k) {
  if (G.answered) return;
  G.answered = true;
  const r = G.rounds[G.i];
  const ok = k === r.ans;
  let gain = 0;
  if (ok) { G.combo++; G.correct++; gain = 10 + Math.min(G.combo - 1, 5) * 2; G.score += gain; } else { G.combo = 0; }
  app.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.k === r.ans) b.classList.add('right');
    else if (b.dataset.k === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const ansLabel = (r.opts.find(o => o.k === r.ans) || {}).l || r.ans;
  $('#fb').innerHTML = `<div class="fb ${ok ? '' : 'bad'}"><strong>${ok ? `ถูกต้อง <span class="gain">+${gain}</span>` : `ยังไม่ใช่ คำตอบคือ ${esc(ansLabel)}`}</strong><p>${esc(r.ex)}</p></div>`;
  if (G.st === 0) { G.placed[r.ans].push(r.piece); }
  if (G.st === 2) {
    if (r.ans === 'name') G.placed.name = r.piece; else G.placed[r.ans].push(r.piece);
  }
  if (G.st === 0 || G.st === 2) {
    const aside = app.querySelector('.side');
    if (aside) {
      aside.outerHTML = sidePanel();
      const tgt = G.st === 0 ? app.querySelector(`.bin[data-bin="${r.ans}"]`) : null;
      if (tgt) { tgt.classList.add('hit'); const last = tgt.querySelector('li:last-child'); if (last) last.classList.add('drop'); }
    }
  }
  hud();
  const nb = $('#nextBtn'); nb.hidden = false; nb.focus({ preventScroll: true });
}

function next() {
  if (!G.answered) return;
  const cur = G.rounds[G.i], nx = G.rounds[G.i + 1];
  G.i++;
  if (G.i >= G.rounds.length) return stationEnd();
  if (G.st === 2 && nx && cur.set !== nx.set) G.placed = { name: '', attr: [], method: [], none: [] };
  render();
}

function starsFor(c, t) { const p = c / t; return p >= 0.9 ? 3 : p >= 0.7 ? 2 : p >= 0.4 ? 1 : 0; }

function stationEnd() {
  const t = G.rounds.length, c = G.correct, s = starsFor(c, t);
  G.res[G.st] = { c, t, s };
  saved.stars[G.st] = Math.max(saved.stars[G.st] || 0, s); persist();
  G.mode = 'sum'; hud();
  const last = G.st === 3;
  const goNext = G.run && !last;
  const tips = [
    'Class คือแม่พิมพ์ Object คือชิ้นงานจริงที่มีค่าข้อมูล ส่วน Attribute คือข้อมูล และ Method คือพฤติกรรม',
    'จำ 4 หลัก: ซ่อนข้อมูล (Encapsulation), สืบทอด (Inheritance), หลายรูปแบบ (Polymorphism), แสดงเฉพาะที่จำเป็น (Abstraction)',
    'กล่องคลาสมี 3 ช่อง ชื่อ ข้อมูล และเมธอด ค่าข้อมูลจริงเป็นของ Object ไม่ใช่ของคลาส',
    'UML แบ่งเป็นกลุ่มโครงสร้าง (เช่น Class) และกลุ่มพฤติกรรม (เช่น Use Case, Activity, Sequence)'
  ];
  app.innerHTML = `
    <section class="sum">
      <h2>จบสถานี ${G.st + 1}: ${STATIONS[G.st].name}</h2>
      <div class="big-stars">${starHTML(s, 'x')}</div>
      <p>ตอบถูก ${c} จาก ${t} ชิ้น · คะแนนสะสม <b class="mono">${G.score}</b></p>
      <p class="note">${tips[G.st]}</p>
      <div class="row" style="margin-top:18px">
        ${goNext ? `<button class="btn" id="goNext">ไปสถานี ${G.st + 2}: ${STATIONS[G.st + 1].name}</button>` : ''}
        ${G.run && last ? `<button class="btn" id="goFinal">ดูใบรายงานผล</button>` : ''}
        <button class="btn ghost" id="again">เล่นสถานีนี้อีกครั้ง</button>
        <button class="btn ghost" id="toHome">กลับหน้าแรก</button>
      </div>
    </section>`;
  if (goNext) $('#goNext').onclick = () => start(G.st + 1);
  if (G.run && last) $('#goFinal').onclick = finalReport;
  $('#again').onclick = () => { if (G.res[G.st]) G.score -= 0; start(G.st); };
  $('#toHome').onclick = home;
  const f = app.querySelector('.btn'); if (f) f.focus({ preventScroll: true });
}

function finalReport() {
  G.mode = 'final';
  const rows = G.res.map((r, i) => r ? `<tr><td>${i + 1}. ${STATIONS[i].name}</td><td>${r.c}/${r.t}</td><td>${starHTML(r.s)}</td></tr>` : '').join('');
  const tc = G.res.reduce((a, r) => a + (r ? r.c : 0), 0), tt = G.res.reduce((a, r) => a + (r ? r.t : 0), 0);
  const p = tt ? tc / tt : 0;
  const rank = p >= 0.9 ? 'หัวหน้าวิศวกรระบบ' : p >= 0.7 ? 'นักออกแบบระบบ' : p >= 0.5 ? 'ช่างเทคนิค' : 'ช่างฝึกหัด';
  const newBest = G.score > (saved.best || 0);
  if (newBest) { saved.best = G.score; persist(); }
  hud();
  app.innerHTML = `
    <section class="sum">
      <h2>ใบรายงานผลการผลิต</h2>
      <p class="rank">${rank}</p>
      <p>ถูกทั้งหมด ${tc} จาก ${tt} ชิ้น (${Math.round(p * 100)}%) · คะแนนรวม <b class="mono">${G.score}</b>${newBest ? ' · คะแนนสูงสุดใหม่' : ''}</p>
      <table class="rep"><thead><tr><th>สถานี</th><th>ตอบถูก</th><th>ดาว</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">สัปดาห์ถัดไปเราจะใช้พื้นฐานนี้วาด Use Case Diagram: ใครใช้ระบบ และระบบทำอะไรให้เขา</p>
      <div class="row" style="margin-top:18px"><button class="btn" id="replay">เล่นใหม่ทั้ง 4 สถานี</button><button class="btn ghost" id="toHome2">กลับหน้าแรก</button></div>
    </section>`;
  $('#replay').onclick = () => { G.score = 0; G.res = [null, null, null, null]; G.run = true; start(0); };
  $('#toHome2').onclick = home;
}

document.addEventListener('keydown', e => {
  if (G.mode !== 'play') return;
  if (/^[1-4]$/.test(e.key) && !G.answered) {
    const r = G.rounds[G.i]; const o = r.opts[+e.key - 1];
    if (o) { e.preventDefault(); answer(o.k); }
  } else if (e.key === 'Enter' && G.answered && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
    e.preventDefault(); next();
  }
});
$('#homeBtn').onclick = home;
home();
</script>
</body>
</html>
